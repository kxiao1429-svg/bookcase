<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e7ebf0">
<title>书库 · 登录</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('bookcase-theme')||'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
  :root {
    color-scheme: light;
    --bg: #e7ebf0; --card: #fbfcfe; --line: #c2cad7;
    --text: #0f1726; --muted: #55617a; --faint: #8b95a8; --accent: #bf3a2b;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1420; --card: #16202f; --line: #26344a;
    --text: #e7edf5; --muted: #93a3b8; --faint: #6b7c92; --accent: #e0685a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; padding: 22px; }
  .card {
    width: 100%; max-width: 360px;
    background: var(--bg); border: 1px solid var(--text); border-radius: 0;
    padding: 26px 22px calc(22px + env(safe-area-inset-bottom, 0px));
  }
  .logo { width: 40px; height: 40px; color: var(--accent); margin-bottom: 14px; }
  h1 {
    margin: 0; font-family: "Noto Serif SC", "Songti SC", serif;
    font-size: 1.3rem; letter-spacing: .26em; font-weight: 700;
  }
  p { margin: 8px 0 0; font-size: .8rem; line-height: 1.75; color: var(--muted); }
  label {
    display: block; margin: 24px 0 7px;
    font-family: "Cascadia Mono", "SF Mono", Consolas, monospace;
    font-size: .62rem; color: var(--faint); letter-spacing: .18em; text-transform: uppercase;
  }
  input {
    width: 100%; padding: 12px 13px; border-radius: 0;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    font: inherit; font-size: .94rem; outline: none;
  }
  input:focus { border-color: var(--text); }
  button {
    width: 100%; margin-top: 14px; padding: 13px;
    border: 1px solid var(--text); border-radius: 0;
    background: var(--text); color: var(--bg);
    font: inherit; font-size: .92rem; font-weight: 600; letter-spacing: .04em; cursor: pointer;
  }
  button:active { opacity: .85; }
  button:disabled { opacity: .5; }
  .err { min-height: 1.2em; margin-top: 12px; font-size: .78rem; color: var(--accent); }
  .foot { margin-top: 20px; font-size: .68rem; color: var(--faint); line-height: 1.8; }
  code {
    background: var(--card); border: 1px solid var(--line); border-radius: 0;
    padding: 1px 5px; font-size: .92em;
  }
</style>
</head>
<body>
<form class="card" id="loginForm">
  <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5V5.5Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5Z" fill="currentColor" opacity=".25"/></svg>
  <h1>书库</h1>
  <p>这个书库放在你的私有云上，输入访问口令才能进入。</p>
  <label for="token">访问口令</label>
  <input id="token" type="password" name="token" autocomplete="current-password"
         placeholder="输入访问口令" autofocus required>
  <button id="loginBtn" type="submit">进入书库</button>
  <div class="err" id="err"></div>
  <div class="foot">口令在部署时设置的 <code>token</code> 里；<br>忘了的话在 <code>config.json</code> 改掉后重启服务。</div>
</form>
<script>
(() => {
  'use strict';
  const form = document.getElementById('loginForm');
  const input = document.getElementById('token');
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('err');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = input.value.trim();
    if (!token) { err.textContent = '先输入口令'; return; }
    btn.disabled = true;
    err.textContent = '';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '口令不对');
      location.replace('/');
    } catch (ex) {
      err.textContent = ex.message || '登录失败';
      input.select();
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
